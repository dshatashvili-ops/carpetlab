# Production stack. Секреты берутся из deploy/.env (не коммитится).
# Образы не собирались в CI и не запускались при разработке: проверьте сборку при первом деплое.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: carpet_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: carpetlab
    # Доступен только с самого сервера: так работает cron-задание deploy/backup.sh
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=test ! -f /wal/%f && cp %p /wal/%f"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpet_admin -d carpetlab"]
      interval: 5s
      retries: 20

  # Порядок важен: роль -> миграции -> права (права выдаются на уже созданные таблицы).
  init-roles:
    image: postgres:16
    user: root
    entrypoint: ["/bin/sh", "/init-roles.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./init-roles.sh:/init-roles.sh:ro
      - walarchive:/wal
    depends_on:
      db: { condition: service_healthy }

  migrate:
    build: ../backend
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://carpet_admin:${POSTGRES_PASSWORD}@db:5432/carpetlab
    depends_on:
      init-roles: { condition: service_completed_successfully }

  grants:
    image: postgres:16
    command: ["psql", "postgresql://carpet_admin:${POSTGRES_PASSWORD}@db:5432/carpetlab", "-v", "ON_ERROR_STOP=1", "-f", "/grants.sql"]
    volumes:
      - ./grants.sql:/grants.sql:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://carpet_app:${APP_DB_PASSWORD}@db:5432/carpetlab
      APP_URL: ${APP_URL}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      grants: { condition: service_completed_successfully }

  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend]

volumes:
  pgdata: {}
  walarchive: {}
  storage: {}
  caddy_data: {}
