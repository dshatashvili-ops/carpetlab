# Production stack. Секреты берутся из deploy/.env (не коммитится). Образы в этом репозитории не собирались в CI: проверьте сборку при первом деплое.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: carpet_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: carpetlab
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=test ! -f /wal/%f && cp %p /wal/%f"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpet_admin -d carpetlab"]
      interval: 5s
      retries: 20

  migrate:
    build: ../backend
    command: >
      sh -c "npx prisma migrate deploy &&
             psql \"$$DATABASE_ADMIN_URL\" -c \"DO \\$$\\$$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='carpet_app') THEN CREATE ROLE carpet_app LOGIN NOBYPASSRLS PASSWORD '${APP_DB_PASSWORD}'; END IF; END \\$$\\$$;\""
    environment:
      DATABASE_URL: postgresql://carpet_admin:${POSTGRES_PASSWORD}@db:5432/carpetlab
      DATABASE_ADMIN_URL: postgresql://carpet_admin:${POSTGRES_PASSWORD}@db:5432/carpetlab
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://carpet_app:${APP_DB_PASSWORD}@db:5432/carpetlab
      APP_URL: ${APP_URL}
      SMTP_URL: ${SMTP_URL}
      MAIL_FROM: ${MAIL_FROM}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY}
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend]

volumes:
  pgdata: {}
  walarchive: {}
  storage: {}
  caddy_data: {}
